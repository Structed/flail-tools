<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>FLAIL! Tools - The dice table</title>
  <desc>Original sharing artwork by the flail-tools contributors, with an ink-drawn twenty-sided die and a six-sided die. Not derived from the game's artwork or logo.</desc>
  <path fill="#f4efe4" d="M0 0H1200V630H0Z"/>
  <path fill="none" stroke="#7c2d12" stroke-width="3" d="M72 49Q560 46 1128 49"/>
  <rect x="72" y="81" width="306" height="55" rx="3" fill="#7c2d12"/>
  <text x="96" y="119" fill="#f4efe4" font-family="Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="2">UNOFFICIAL TOOL</text>
  <text x="404" y="119" fill="#7c2d12" font-family="Georgia, 'Times New Roman', serif" font-size="30">FLAIL! Tools</text>
  <g fill="#1c1a17" font-family="Georgia, 'Times New Roman', serif">
    <text x="68" y="252" font-size="86">The dice table</text>
    <text x="72" y="312" font-size="30">Roll where the whole party can see it.</text>
  </g>
  <g fill="#5b544b" font-family="Arial, sans-serif" font-size="24">
    <text x="72" y="384">To Hit pools, saves, ordinary notation.</text>
    <text x="72" y="422">Straight between browsers. Nothing stored.</text>
  </g>
