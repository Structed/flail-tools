    </g>
    <text x="200" y="152" fill="#1c1a17" font-family="Georgia, 'Times New Roman', serif" font-size="46" text-anchor="middle">20</text>
    <g transform="rotate(-9 74 266)">
      <rect x="18" y="210" width="112" height="112" rx="14" fill="#f4efe4" stroke="#1c1a17" stroke-width="15" stroke-linejoin="round"/>
      <g fill="#1c1a17">
