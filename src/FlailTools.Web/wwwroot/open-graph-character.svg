<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>FLAIL! Tools - A character sheet</title>
  <desc>Original sharing artwork by the flail-tools contributors, with an ink-drawn character sheet showing three attribute boxes. Not derived from the game's artwork or logo.</desc>
  <path fill="#f4efe4" d="M0 0H1200V630H0Z"/>
  <path fill="none" stroke="#7c2d12" stroke-width="3" d="M72 49Q560 46 1128 49"/>
  <rect x="72" y="81" width="306" height="55" rx="3" fill="#7c2d12"/>
  <text x="96" y="119" fill="#f4efe4" font-family="Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="2">UNOFFICIAL TOOL</text>
  <text x="404" y="119" fill="#7c2d12" font-family="Georgia, 'Times New Roman', serif" font-size="30">FLAIL! Tools</text>
  <g fill="#1c1a17" font-family="Georgia, 'Times New Roman', serif">
    <text x="68" y="252" font-size="76">A character sheet</text>
    <text x="72" y="312" font-size="30">Somebody has sent you this one.</text>
  </g>
  <g fill="#5b544b" font-family="Arial, sans-serif" font-size="24">
    <text x="72" y="384">The whole sheet travels inside the link.</text>
    <text x="72" y="422">Keep it, or read it and walk away.</text>
  </g>
  <g transform="translate(790,86)">
    <g transform="rotate(-4 160 195)">
      <rect x="30" y="30" width="290" height="330" rx="8" fill="#f4efe4" stroke="#1c1a17" stroke-width="11"/>
      <path fill="none" stroke="#7c2d12" stroke-width="9" stroke-linecap="round" d="M64 92H286"/>
      <g fill="none" stroke="#1c1a17" stroke-width="8">
        <rect x="64" y="126" width="62" height="62" rx="5"/>
        <rect x="144" y="126" width="62" height="62" rx="5"/>
        <rect x="224" y="126" width="62" height="62" rx="5"/>
      </g>
      <g fill="#1c1a17" font-family="Arial, sans-serif" font-size="22" text-anchor="middle">
        <text x="95" y="166">STR</text>
        <text x="175" y="166">DEX</text>
        <text x="255" y="166">LCK</text>
      </g>
      <g fill="none" stroke="#ddd4c2" stroke-width="8" stroke-linecap="round">
        <path d="M64 234H286M64 274H286M64 314H212"/>
      </g>
      <path fill="none" stroke="#7c2d12" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" d="M236 298L258 320L300 270"/>
    </g>
  </g>
  <path fill="none" stroke="#ddd4c2" stroke-width="2" d="M72 500H1128"/>
  <g font-family="Arial, sans-serif">
    <text x="72" y="546" fill="#1c1a17" font-size="24">Independent production. Not affiliated with Games Omnivorous.</text>
    <text x="72" y="586" fill="#7c2d12" font-size="22">flail-tools.pages.dev</text>
  </g>
</svg>
