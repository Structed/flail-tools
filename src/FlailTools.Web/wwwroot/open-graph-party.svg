<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>FLAIL! Tools - Character sheets</title>
  <desc>Original sharing artwork by the flail-tools contributors, with three ink-drawn sheets of paper fanned out. Not derived from the game's artwork or logo.</desc>
  <path fill="#f4efe4" d="M0 0H1200V630H0Z"/>
  <path fill="none" stroke="#7c2d12" stroke-width="3" d="M72 49Q560 46 1128 49"/>
  <rect x="72" y="81" width="306" height="55" rx="3" fill="#7c2d12"/>
  <text x="96" y="119" fill="#f4efe4" font-family="Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="2">UNOFFICIAL TOOL</text>
  <text x="404" y="119" fill="#7c2d12" font-family="Georgia, 'Times New Roman', serif" font-size="30">FLAIL! Tools</text>
  <g fill="#1c1a17" font-family="Georgia, 'Times New Roman', serif">
    <text x="68" y="252" font-size="76">Character sheets</text>
    <text x="72" y="312" font-size="30">Your party, kept in this browser.</text>
  </g>
  <g fill="#5b544b" font-family="Arial, sans-serif" font-size="24">
    <text x="72" y="384">Save a sheet. Hand somebody a link.</text>
    <text x="72" y="422">Send it again and it replaces the old one.</text>
  </g>
  <g transform="translate(770,120)">
    <g transform="rotate(-11 120 170)">
      <rect x="20" y="40" width="200" height="260" rx="6" fill="#f4efe4" stroke="#1c1a17" stroke-width="10"/>
      <g fill="none" stroke="#ddd4c2" stroke-width="7" stroke-linecap="round">
        <path d="M50 110H190M50 148H190M50 186H150"/>
      </g>
    </g>
    <g transform="rotate(5 160 180)">
      <rect x="60" y="30" width="200" height="260" rx="6" fill="#f4efe4" stroke="#1c1a17" stroke-width="10"/>
      <g fill="none" stroke="#ddd4c2" stroke-width="7" stroke-linecap="round">
        <path d="M90 100H230M90 138H230M90 176H190"/>
      </g>
    </g>
    <g transform="rotate(14 210 190)">
      <rect x="110" y="20" width="200" height="260" rx="6" fill="#f4efe4" stroke="#1c1a17" stroke-width="10"/>
      <path fill="none" stroke="#7c2d12" stroke-width="8" stroke-linecap="round" d="M140 78H260"/>
      <g fill="none" stroke="#1c1a17" stroke-width="7" stroke-linecap="round">
        <path d="M140 132H280M140 170H280M140 208H230"/>
