name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_PATH: src/FlailTools.Web/FlailTools.Web.csproj

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Publish
        run: dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --no-restore --output publish

      # Pages serves a project site from /<repo>/, so the app has to be told where it lives. The
      # per-route sharing shells are copies of index.html, so they need telling as well.
      - name: Rewrite base href for GitHub Pages
        run: |
          repo_name='${{ github.repository }}'
          repo_name="${repo_name#*/}"
          if [[ "$repo_name" == *.github.io ]]; then
            base_href='/'
          else
            base_href="/$repo_name/"
          fi
          echo "Using base href: $base_href"
          while IFS= read -r -d '' page; do
            sed -i "s|<base href=\"/\" />|<base href=\"$base_href\" />|g" "$page"
            grep -qF "<base href=\"$base_href\" />" "$page" \
              || { echo "::error::Failed to rewrite <base href> in $page"; exit 1; }
            echo "  rewrote $page"
          done < <(find publish/wwwroot -name index.html -print0)

      # Pages has no SPA rewrite, so a deep link has to be served the app shell as the 404 page.
      - name: Add SPA fallback and disable Jekyll
        run: |
          cp publish/wwwroot/index.html publish/wwwroot/404.html
          touch publish/wwwroot/.nojekyll

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # Allow one concurrent deployment, but never cancel one that is mid-flight.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
