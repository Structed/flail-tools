name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet restore FlailTools.slnx

      - run: dotnet build FlailTools.slnx --no-restore -c Release -warnaserror

      - run: dotnet test FlailTools.slnx --no-build -c Release
