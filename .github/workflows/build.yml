name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Both, because the golden fixtures are byte-compared and line endings differ by platform —
    # a generator that renders CRLF on one and LF on the other would otherwise ship unnoticed.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet restore FlailTools.slnx

      - run: dotnet build FlailTools.slnx --no-restore -c Release -warnaserror

      - run: dotnet test FlailTools.slnx --no-build -c Release
